<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <radialGradient id="washRose">
      <stop stop-color="#ead3d2" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ead3d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washLilac">
      <stop stop-color="#d9d4df" stop-opacity=".38"/>
      <stop offset="1" stop-color="#d9d4df" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washCream">
      <stop stop-color="#eee8d8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#eee8d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkPetal" cx=".35" cy=".28" r=".8">
      <stop stop-color="#fff5f1" stop-opacity=".9"/>
      <stop offset=".7" stop-color="#edc6c7" stop-opacity=".72"/>
      <stop offset="1" stop-color="#dbaeb4" stop-opacity=".58"/>
    </radialGradient>
    <radialGradient id="lilacPetal" cx=".35" cy=".28" r=".8">
      <stop stop-color="#faf5f5" stop-opacity=".9"/>
      <stop offset=".72" stop-color="#d9cede" stop-opacity=".7"/>
      <stop offset="1" stop-color="#c5b7d0" stop-opacity=".58"/>
    </radialGradient>
    <radialGradient id="creamPetal" cx=".35" cy=".28" r=".8">
      <stop stop-color="#fffdf3" stop-opacity=".94"/>
      <stop offset=".72" stop-color="#f0e9ce" stop-opacity=".78"/>
      <stop offset="1" stop-color="#d9d5b9" stop-opacity=".62"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#87947f" stop-opacity=".66"/>
      <stop offset="1" stop-color="#a7a58d" stop-opacity=".54"/>
    </linearGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <g id="flowerPink">
      <g fill="url(#pinkPetal)" stroke="#d7aeb0" stroke-opacity=".35" stroke-width=".8">
        <ellipse cy="-10" rx="5.5" ry="12"/>
        <ellipse cy="-10" rx="5.5" ry="12" transform="rotate(60)"/>
        <ellipse cy="-10" rx="5.5" ry="12" transform="rotate(120)"/>
        <ellipse cy="-10" rx="5.5" ry="12" transform="rotate(180)"/>
        <ellipse cy="-10" rx="5.5" ry="12" transform="rotate(240)"/>
        <ellipse cy="-10" rx="5.5" ry="12" transform="rotate(300)"/>
      </g>
      <circle r="2.2" fill="#d5bd85" fill-opacity=".72"/>
      <circle r=".9" fill="#fffdf3"/>
    </g>
    <g id="flowerLilac">
      <g fill="url(#lilacPetal)" stroke="#bcaec7" stroke-opacity=".32" stroke-width=".75">
        <ellipse cy="-9" rx="5" ry="11"/>
        <ellipse cy="-9" rx="5" ry="11" transform="rotate(72)"/>
        <ellipse cy="-9" rx="5" ry="11" transform="rotate(144)"/>
        <ellipse cy="-9" rx="5" ry="11" transform="rotate(216)"/>
        <ellipse cy="-9" rx="5" ry="11" transform="rotate(288)"/>
      </g>
      <circle r="2" fill="#d7c58d" fill-opacity=".75"/>
    </g>
    <g id="flowerCream">
      <g fill="url(#creamPetal)" stroke="#c9c4a8" stroke-opacity=".35" stroke-width=".7">
        <ellipse cy="-8" rx="4.3" ry="9"/>
        <ellipse cy="-8" rx="4.3" ry="9" transform="rotate(72)"/>
        <ellipse cy="-8" rx="4.3" ry="9" transform="rotate(144)"/>
        <ellipse cy="-8" rx="4.3" ry="9" transform="rotate(216)"/>
        <ellipse cy="-8" rx="4.3" ry="9" transform="rotate(288)"/>
      </g>
      <circle r="2" fill="#d4b96e"/>
    </g>
    <g id="sprig" stroke="url(#stem)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0C11-30 20-62 17-100" stroke-width="1.25"/>
      <path d="M8-26c-15-6-21-16-18-31 13 5 19 15 18 31Zm7-24c12-9 15-21 8-35-11 9-14 21-8 35Zm2-21c-12-10-14-23-6-36 11 10 13 22 6 36Z" fill="#c6ceb5" fill-opacity=".48" stroke-width=".85"/>
      <path d="M6-35c-5 12-9 23-11 35m21-50c5 11 8 21 9 31m-17-48c-4 12-7 21-8 33" stroke-width=".65" opacity=".8"/>
    </g>
    <g id="grass" stroke="url(#stem)" stroke-linecap="round">
      <path d="M0 0C-7-22-20-40-35-52M0 0C-3-30-2-48 5-66M0 0C8-22 20-39 37-51M0 0C-14-15-29-24-48-28M0 0C15-14 30-22 48-24" stroke-width="1.1"/>
      <path d="M-21-37c8 2 13 7 15 15m10-29c5 6 7 13 6 21m17-35c-8 5-12 11-14 19m-34-4c8 0 14 3 19 9m26-8c-7 2-13 6-17 12" stroke-width=".7" opacity=".78"/>
    </g>
  </defs>

  <g filter="url(#soft)" opacity=".8">
    <ellipse cx="145" cy="176" rx="190" ry="150" fill="url(#washRose)"/>
    <ellipse cx="1435" cy="205" rx="210" ry="170" fill="url(#washLilac)"/>
    <ellipse cx="205" cy="800" rx="230" ry="190" fill="url(#washLilac)"/>
    <ellipse cx="1420" cy="820" rx="240" ry="190" fill="url(#washRose)"/>
    <ellipse cx="760" cy="65" rx="390" ry="105" fill="url(#washCream)"/>
    <ellipse cx="820" cy="950" rx="500" ry="115" fill="url(#washRose)"/>
  </g>

  <g opacity=".58">
    <use href="#sprig" transform="translate(88 258) rotate(-17) scale(1.05)"/>
    <use href="#sprig" transform="translate(214 205) rotate(12) scale(.8)"/>
    <use href="#sprig" transform="translate(362 135) rotate(-10) scale(.82)"/>
    <use href="#sprig" transform="translate(1320 205) rotate(16) scale(.84)"/>
    <use href="#sprig" transform="translate(1480 265) rotate(-13) scale(1.05)"/>
    <use href="#sprig" transform="translate(95 790) rotate(-12) scale(1.08)"/>
    <use href="#sprig" transform="translate(310 858) rotate(14) scale(.82)"/>
    <use href="#sprig" transform="translate(1270 850) rotate(-13) scale(.9)"/>
    <use href="#sprig" transform="translate(1500 760) rotate(15) scale(1.05)"/>
    <use href="#sprig" transform="translate(665 135) rotate(8) scale(.62)"/>
    <use href="#sprig" transform="translate(952 880) rotate(-7) scale(.66)"/>
  </g>

  <g opacity=".75">
    <use href="#flowerPink" transform="translate(150 112) scale(1.55)"/>
    <use href="#flowerCream" transform="translate(92 184) scale(1.15)"/>
    <use href="#flowerLilac" transform="translate(228 91) scale(.94)"/>
    <use href="#flowerPink" transform="translate(367 61) scale(.9)"/>
    <use href="#flowerCream" transform="translate(1337 119) scale(1.1)"/>
    <use href="#flowerLilac" transform="translate(1455 144) scale(1.15)"/>
    <use href="#flowerPink" transform="translate(1520 80) scale(1.45)"/>
    <use href="#flowerCream" transform="translate(73 650) scale(1.15)"/>
    <use href="#flowerLilac" transform="translate(223 602) scale(1.12)"/>
    <use href="#flowerPink" transform="translate(335 735) scale(.84)"/>
    <use href="#flowerCream" transform="translate(1465 605) scale(1.25)"/>
    <use href="#flowerLilac" transform="translate(1370 710) scale(1.15)"/>
    <use href="#flowerPink" transform="translate(1530 775) scale(1.3)"/>
    <use href="#flowerPink" transform="translate(180 935) scale(1.2)"/>
    <use href="#flowerCream" transform="translate(400 908) scale(1.08)"/>
    <use href="#flowerLilac" transform="translate(1180 933) scale(1.08)"/>
    <use href="#flowerPink" transform="translate(1400 900) scale(1.4)"/>
    <use href="#flowerCream" transform="translate(770 64) scale(.8)"/>
    <use href="#flowerLilac" transform="translate(830 946) scale(.82)"/>
  </g>

  <g opacity=".55">
    <use href="#grass" transform="translate(92 330) scale(1.3)"/>
    <use href="#grass" transform="translate(266 362) scale(.82)"/>
    <use href="#grass" transform="translate(1492 373) scale(1.22)"/>
    <use href="#grass" transform="translate(1305 327) scale(.85)"/>
    <use href="#grass" transform="translate(110 985) scale(1.1)"/>
    <use href="#grass" transform="translate(1470 981) scale(1.2)"/>
    <use href="#grass" transform="translate(445 975) scale(.8)"/>
    <use href="#grass" transform="translate(1160 980) scale(.9)"/>
  </g>
</svg>
